<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Website Two - Receiver</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; padding-top: 50px; background: #e9ecef; }
        .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; }
        span { color: #007bff; font-weight: bold; }
        a { display: block; margin-top: 20px; color: #666; text-decoration: none; font-size: 0.9rem; }
    </style>
</head>
<body>

<div class="card">
    <h1>Welcome, <span id="display-name">Guest</span>!</h1>
    <p>The value above was retrieved from the URL query string.</p>
    <a href="index.html">← Go Back</a>
</div>

<script>
    // 1. Grab the query string (the part after the '?')
    const queryString = window.location.search;
    
    // 2. Parse the parameters
    const urlParams = new URLSearchParams(queryString);
    
    // 3. Get the specific 'user' value
    const user = urlParams.get('user');

    // 4. Update the UI
    if (user) {
        document.getElementById('display-name').textContent = user;
    }
</script>

</body>
</html>
